; ============================================
; N5LA MOD CONFIGURATION
; ============================================

[ESP]
; Enable/Disable Wallhack (1=On, 0=Off)
WALLHACK=1

; Show enemy boxes (1=On, 0=Off)
BOX=1

; Show health bars (1=On, 0=Off)
HEALTH_BAR=1

; Show enemy names (1=On, 0=Off)
NAME=1

; Show enemy counter (1=On, 0=Off)
ENEMY_COUNTER=1

; Show distance to enemies (1=On, 0=Off)
DISTANCE=1

; White character color (1=On, 0=Off)
CHARACTER_COLOR=1

[AIMBOT]
; Aim strength (0-10, 0=Off, 10=Maximum)
STRENGTH=5

[NORECOIL]
; No Recoil (1=On, 0=Off)
ENABLE=1

[MAGICBULLET]
; Magic bullet scale (100-500)
SCALE=150

[IPADVIEW]
; Field of View (70-150)
FOV=115

[PERFORMANCE]
; Visual cleanup (remove fog, grass, water) (1=On, 0=Off)
VISUAL_CLEANUP=1